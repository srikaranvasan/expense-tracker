<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add expense — mobile light</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  *{box-sizing:border-box;}
  body{margin:0;}
  input,textarea{font-family:'Manrope',sans-serif; font-size:15px; width:100%; padding:12px 13px; border:1.5px solid rgba(30,27,41,0.28); background:#FFFFFF; color:#1E1B29; outline:none;}
  .mx-label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:#5B5770; margin-bottom:7px; display:block;}
</style>
</head>
<body>
<div style="width:393px; height:1260px; background:#FAF7F2; font-family:'Manrope',sans-serif; color:#1E1B29;">

  <div style="height:50px; background:#FFFFFF; border-bottom:2px solid #1E1B29; display:flex; align-items:center; justify-content:space-between; padding:0 16px;">
    <div style="display:flex; align-items:center; gap:8px;">
      <div style="width:14px;height:14px;background:#7FD1C3;border:1.5px solid #1E1B29;transform:rotate(45deg);"></div>
      <span style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.5px;">Expense Tracker</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:20px;height:20px;background:#7FD1C3;border:1.5px solid #1E1B29;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:8px;color:#1E1B29;flex-shrink:0;">MI</div>
      <div title="Sign out" aria-label="Sign out" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1.5px solid #1E1B29;background:#FFFFFF;flex-shrink:0;"><svg width="13" height="13" viewBox="0 0 16 16"><path d="M6 2H3.5C2.7 2 2 2.7 2 3.5V12.5C2 13.3 2.7 14 3.5 14H6" stroke="#1E1B29" stroke-width="1.5" fill="none"/><path d="M6 8H14M14 8L11 5M14 8L11 11" stroke="#1E1B29" stroke-width="1.5" fill="none"/></svg></div>
    </div>
  </div>

  <div style="padding:20px 18px 24px;">
    <div style="font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#1D7A6C;">Record &middot; TXN-08232</div>
    <h1 style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px; margin:6px 0 0;">Add expense</h1>
    <p style="margin:5px 0 0; color:#5B5770; font-size:13px;">Something you paid for yourself.</p>

    <div style="display:flex; gap:8px; margin-top:16px; overflow-x:auto;">
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px; padding:10px 12px; background:#FFFFFF; border:2px solid #1E1B29; white-space:nowrap;"><svg width="12" height="12" viewBox="0 0 16 16" style="margin-right:5px; vertical-align:-2px;"><path d="M2 5H14M14 5L11 2M14 5L11 8" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M14 11H2M2 11L5 8M2 11L5 14" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>Split instead</div>
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px; padding:10px 12px; background:#FFFFFF; border:2px solid #1E1B29; white-space:nowrap;"><svg width="12" height="12" viewBox="0 0 16 16" style="margin-right:5px; vertical-align:-2px;"><path d="M2 8H14M9 3L14 8L9 13" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>Transfer</div>
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px; padding:10px 12px; background:#FFFFFF; border:2px solid #1E1B29; white-space:nowrap;"><svg width="12" height="12" viewBox="0 0 16 16" style="margin-right:5px; vertical-align:-2px;"><rect x="2" y="3" width="12" height="10" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="2" y1="6.5" x2="14" y2="6.5" stroke="currentColor" stroke-width="1.5"/></svg>Pay card</div>
    </div>

    <div style="margin-top:20px; background:#FFFFFF; border:2px solid #1E1B29; box-shadow:4px 4px 0 #1E1B29; padding:22px 20px;">
      <label class="mx-label">Amount (INR) <span style="color:#D1523F;">*</span></label>
      <div style="position:relative; margin-bottom:18px;">
        <span style="position:absolute; left:13px; top:11px; font-family:'IBM Plex Mono',monospace; font-size:18px; color:#8B87A0;">&#8377;</span>
        <input placeholder="0.00" style="font-family:'IBM Plex Mono',monospace; font-size:18px; padding-left:30px;">
      </div>

      <label class="mx-label">What was it for? <span style="color:#D1523F;">*</span></label>
      <input placeholder="Groceries" style="margin-bottom:18px;">

      <label class="mx-label">Paid from <span style="color:#D1523F;">*</span></label>
      <div style="border:1.5px solid rgba(30,27,41,0.28); background:#FFFFFF; padding:12px 13px; display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
        <span style="display:flex; align-items:center; gap:8px;"><svg width="15" height="15" viewBox="0 0 16 16"><rect x="1.5" y="4.5" width="13" height="9" stroke="#1E1B29" stroke-width="1.3" fill="none"/><rect x="9.3" y="7.5" width="3.7" height="3" stroke="#1E1B29" stroke-width="1.1" fill="none"/></svg>HDFC Savings</span>
        <svg width="12" height="8" viewBox="0 0 12 8"><path d="M1 1L6 6L11 1" stroke="#1E1B29" stroke-width="2" fill="none"/></svg>
      </div>

      <label class="mx-label">Category</label>
      <div style="border:1.5px solid rgba(30,27,41,0.28); background:#FFFFFF; padding:12px 13px; display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; color:#1D7A6C;">
        <span style="display:flex; align-items:center; gap:8px;"><svg width="14" height="14" viewBox="0 0 16 16" style=""><rect x="1.5" y="1.5" width="5" height="5" stroke="#1D7A6C" stroke-width="1.4" fill="none"/><rect x="9.5" y="1.5" width="5" height="5" stroke="#1D7A6C" stroke-width="1.4" fill="none"/><rect x="1.5" y="9.5" width="5" height="5" stroke="#1D7A6C" stroke-width="1.4" fill="none"/><rect x="9.5" y="9.5" width="5" height="5" stroke="#1D7A6C" stroke-width="1.4" fill="none"/></svg>No category</span>
        <svg width="12" height="8" viewBox="0 0 12 8"><path d="M1 1L6 6L11 1" stroke="#1D7A6C" stroke-width="2" fill="none"/></svg>
      </div>

      <label class="mx-label">Date <span style="color:#D1523F;">*</span></label>
      <div style="border:1.5px solid rgba(30,27,41,0.28); background:#FFFFFF; padding:12px 13px; margin-bottom:18px; font-family:'IBM Plex Mono',monospace;">09/21/2026</div>

      <label class="mx-label">Notes (optional)</label>
      <textarea rows="2" style="resize:none; margin-bottom:22px;"></textarea>

      <div style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px; padding:15px; text-align:center; background:#7FD1C3; color:#1E1B29; border:2px solid #1E1B29; box-shadow:4px 4px 0 #1E1B29; margin-bottom:12px;">Record expense</div>
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px; padding:13px; text-align:center; color:#1E1B29; text-decoration:underline; text-underline-offset:4px;">Cancel</div>
    </div>

    <div style="margin-top:16px; background:#DCF3EE; border:1.5px solid #1E1B29; padding:16px;">
      <div style="font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:#1D7A6C;">Reference</div>
      <div style="font-family:'IBM Plex Mono',monospace; font-size:13px; margin-top:6px;">TXN-08232 &middot; draft</div>
    </div>
  </div>

  <div style="height:62px; background:#FFFFFF; border-top:2px solid #1E1B29; display:flex; align-items:center; justify-content:space-around; padding:0 6px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:3px; color:#8B87A0;"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 7L8 2L14 7" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M4 6.5V13.5H12V6.5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg><span style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:10px;">Home</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:3px; color:#1E1B29; border-bottom:3px solid #7FD1C3; padding-bottom:5px; margin-bottom:-5px;"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M1 8H4L6 3L10 13L12 8H15" stroke="currentColor" stroke-width="1.5" fill="none"/></svg><span style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:10px;">Activity</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:3px; color:#8B87A0;"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="4.5" width="13" height="9" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="9.3" y="7.5" width="3.7" height="3" stroke="currentColor" stroke-width="1.3" fill="none"/></svg><span style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:10px;">Accounts</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:3px; color:#8B87A0;"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="5" width="6.5" height="6.5" stroke="currentColor" stroke-width="1.4" fill="none" transform="rotate(45 4.25 8.25)"/><rect x="7.2" y="5" width="6.5" height="6.5" stroke="currentColor" stroke-width="1.4" fill="none" transform="rotate(45 10.45 8.25)"/></svg><span style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:10px;">People</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:3px; color:#8B87A0;"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5" height="5" stroke="currentColor" stroke-width="1.4" fill="none"/><rect x="9.5" y="1.5" width="5" height="5" stroke="currentColor" stroke-width="1.4" fill="none"/><rect x="1.5" y="9.5" width="5" height="5" stroke="currentColor" stroke-width="1.4" fill="none"/><rect x="9.5" y="9.5" width="5" height="5" stroke="currentColor" stroke-width="1.4" fill="none"/></svg><span style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:10px;">Categories</span></div>
  </div>
</div>
</body>
</html>
