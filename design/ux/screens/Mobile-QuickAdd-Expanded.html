<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick add — expanded state</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  *{box-sizing:border-box;}
  body{margin:0;}
  .qa-pill{display:flex; align-items:center; justify-content:flex-end; gap:10px; position:absolute; right:20px;}
  .qa-label{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; background:#FFFFFF; padding:6px 12px; border:1.5px solid #1E1B29; white-space:nowrap;}
  .qa-icon{width:44px;height:44px;background:#FFFFFF;border:2px solid #1E1B29;box-shadow:3px 3px 0 #1E1B29;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
</style>
</head>
<body>
<div style="width:393px; height:560px; position:relative; background:#FAF7F2; font-family:'Manrope',sans-serif; color:#1E1B29; overflow:hidden;">

  <!-- dimmed scrim over the rest of the dashboard -->
  <div style="position:absolute; inset:0; background:rgba(20,18,32,0.45);"></div>

  <!-- explainer -->
  <div style="position:absolute; top:26px; left:20px; right:20px;">
    <div style="font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#FFFFFF;">Quick-add &middot; expanded state</div>
    <div style="font-size:13.5px; color:#EDEAE3; margin-top:8px; line-height:1.55;">Tap the <strong style="color:#FFFFFF;">+</strong> to reveal these four. Press &amp; hold the <strong style="color:#FFFFFF;">+</strong> itself to jump straight to Add expense.</div>
  </div>

  <!-- stacked actions, farthest from FAB first -->
  <div class="qa-pill" style="bottom:316px;">
    <span class="qa-label">Pay card</span>
    <div class="qa-icon"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" stroke="#1E1B29" stroke-width="1.4" fill="none"/><line x1="2" y1="6.5" x2="14" y2="6.5" stroke="#1E1B29" stroke-width="1.4"/></svg></div>
  </div>
  <div class="qa-pill" style="bottom:260px;">
    <span class="qa-label">Transfer</span>
    <div class="qa-icon"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 8H14M9 3L14 8L9 13" stroke="#1E1B29" stroke-width="1.4" fill="none"/></svg></div>
  </div>
  <div class="qa-pill" style="bottom:204px;">
    <span class="qa-label">Split a bill</span>
    <div class="qa-icon"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 5H14M14 5L11 2M14 5L11 8" stroke="#1E1B29" stroke-width="1.4" fill="none"/><path d="M14 11H2M2 11L5 8M2 11L5 14" stroke="#1E1B29" stroke-width="1.4" fill="none"/></svg></div>
  </div>
  <div class="qa-pill" style="bottom:148px;">
    <span class="qa-label" style="background:#7FD1C3;">Add expense</span>
    <div class="qa-icon" style="background:#7FD1C3;"><svg width="16" height="16" viewBox="0 0 16 16"><line x1="8" y1="2" x2="8" y2="14" stroke="#1E1B29" stroke-width="1.8"/><line x1="2" y1="8" x2="14" y2="8" stroke="#1E1B29" stroke-width="1.8"/></svg></div>
  </div>

  <!-- FAB, now in its open (dismiss) state -->
  <div style="position:absolute; right:20px; bottom:84px; width:52px; height:52px; background:#7FD1C3; border:2px solid #1E1B29; box-shadow:4px 4px 0 #1E1B29; display:flex; align-items:center; justify-content:center;">
    <svg width="20" height="20" viewBox="0 0 16 16" style="transform:rotate(45deg);"><line x1="8" y1="2" x2="8" y2="14" stroke="#1E1B29" stroke-width="2"/><line x1="2" y1="8" x2="14" y2="8" stroke="#1E1B29" stroke-width="2"/></svg>
  </div>

  <!-- bottom nav, for context only -->
  <div style="position:absolute; left:0; right:0; bottom:0; height:64px; background:#FFFFFF; border-top:2px solid #1E1B29;"></div>
</div>
</body>
</html>
