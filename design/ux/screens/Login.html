<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — light</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  *{box-sizing:border-box;}
  body{margin:0;}
  input{font-family:'Manrope',sans-serif; font-size:15px; width:100%; padding:13px 14px; border:1.5px solid rgba(30,27,41,0.28); background:#FFFFFF; color:#1E1B29; outline:none;}
  input::placeholder{color:#A6A2BC;}
  .lg-label{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#5B5770; margin-bottom:8px; display:block;}
</style>
</head>
<body>
<div style="width:1440px; height:900px; background:#FAF7F2; background-image:linear-gradient(rgba(30,27,41,0.05) 1px, transparent 1px),linear-gradient(90deg, rgba(30,27,41,0.05) 1px, transparent 1px); background-size:24px 24px; display:flex; align-items:center; justify-content:center; font-family:'Manrope',sans-serif; position:relative;">

  <div style="position:absolute; top:48px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px;">
    <div style="width:22px; height:22px; background:#7FD1C3; border:2px solid #1E1B29; transform:rotate(45deg);"></div>
    <span style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; color:#1E1B29;">Expense Tracker</span>
  </div>

  <div style="width:440px; background:#FFFFFF; border:2px solid #1E1B29; box-shadow:8px 8px 0 #1E1B29; padding:44px 40px; position:relative;">
    <div style="position:absolute; top:14px; left:14px; width:14px; height:14px; border-top:2.5px solid #1E1B29; border-left:2.5px solid #1E1B29;"></div>
    <div style="position:absolute; top:14px; right:14px; width:14px; height:14px; border-top:2.5px solid #1E1B29; border-right:2.5px solid #1E1B29;"></div>
    <div style="position:absolute; bottom:14px; left:14px; width:14px; height:14px; border-bottom:2.5px solid #1E1B29; border-left:2.5px solid #1E1B29;"></div>
    <div style="position:absolute; bottom:14px; right:14px; width:14px; height:14px; border-bottom:2.5px solid #1E1B29; border-right:2.5px solid #1E1B29;"></div>

    <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; color:#1D7A6C; text-transform:uppercase;">Ledger access</div>
    <h1 style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px; color:#1E1B29; margin:8px 0 28px;">Sign in</h1>

    <label class="lg-label">Email <span style="color:#D1523F;">*</span></label>
    <div style="position:relative; margin-bottom:22px;">
      <svg width="15" height="15" viewBox="0 0 16 16" style="position:absolute; left:14px; top:16px; pointer-events:none;"><rect x="1.5" y="3" width="13" height="10" stroke="#8B87A0" stroke-width="1.3" fill="none"/><path d="M1.5 3.5L8 9L14.5 3.5" stroke="#8B87A0" stroke-width="1.3" fill="none"/></svg>
      <input type="email" placeholder="you@vuedata.in" style="padding-left:40px;">
    </div>

    <label class="lg-label">Password <span style="color:#D1523F;">*</span></label>
    <div style="position:relative; margin-bottom:30px;">
      <svg width="14" height="14" viewBox="0 0 16 16" style="position:absolute; left:15px; top:16px; pointer-events:none;"><rect x="3" y="7" width="10" height="7" stroke="#8B87A0" stroke-width="1.3" fill="none"/><path d="M5 7V4.5C5 2.6 6.6 1 8 1C9.4 1 11 2.6 11 4.5V7" stroke="#8B87A0" stroke-width="1.3" fill="none"/></svg>
      <input type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" style="padding-left:40px;">
    </div>

    <div style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; padding:15px; text-align:center; background:#7FD1C3; color:#1E1B29; border:2px solid #1E1B29; box-shadow:4px 4px 0 #1E1B29; cursor:pointer;">Sign in</div>

    <div style="text-align:center; margin-top:24px; font-size:13.5px; color:#5B5770;">
      No account yet? <span style="color:#1E1B29; font-weight:600; text-decoration:underline; text-underline-offset:3px;">Create one</span>
    </div>
  </div>

  <div style="position:absolute; bottom:48px; left:50%; transform:translateX(-50%); font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.05em; color:#8B87A0;">EVERY ENTRY TIMESTAMPED &middot; NOTHING STORED THAT CAN'T BE RECOMPUTED</div>
</div>
</body>
</html>
